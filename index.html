<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planificateur Maternelle</title>
  <style>
    /* Style de base — page de login */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login-box {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 380px;
    }

    h1 {
      font-size: 1.4rem;
      color: #2d6a4f;
      margin-bottom: 0.25rem;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 1.5rem;
    }

    input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    button {
      width: 100%;
      padding: 0.75rem;
      background: #2d6a4f;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover { background: #1b4332; }

    #message {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #666;
      text-align: center;
    }

    #message.erreur { color: #c0392b; }
    #message.succes { color: #2d6a4f; }
  </style>
</head>
<body>

<div class="login-box">
  <h1>🍀 Planificateur Maternelle</h1>
  <p class="subtitle">Connectez-vous pour accéder à votre espace.</p>

  <input type="email" id="email" placeholder="Votre adresse email" />
  <input type="password" id="password" placeholder="Votre mot de passe" />
  <button onclick="seConnecter()">Se connecter</button>

  <div id="message"></div>
</div>

<script>
  // Configuration Supabase
  const SUPABASE_URL = 'https://wqsprjlocuhandhvpytx.supabase.co';
  const SUPABASE_ANON_KEY = 'REMPLACE_PAR_TA_CLE_ANON';

  // Connexion utilisatrice
  async function seConnecter() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('message');

    msg.className = '';
    msg.textContent = 'Connexion en cours...';

    const response = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ email, password })
    });

    const data = await response.json();

    if (data.access_token) {
      // Stocker le token en session
      sessionStorage.setItem('sb_access_token', data.access_token);
      sessionStorage.setItem('sb_user_id', data.user.id);

      msg.className = 'succes';
      msg.textContent = 'Connectée ! Redirection...';

      // Redirection vers le cahier journal
      setTimeout(() => { window.location.href = 'semaine.html'; }, 800);
    } else {
      msg.className = 'erreur';
      msg.textContent = 'Email ou mot de passe incorrect.';
    }
  }
</script>

</body>
</html>
