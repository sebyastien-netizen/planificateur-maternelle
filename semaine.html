<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cahier journal — Planificateur Maternelle</title>
  <style>
    /* Reset et base */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f0;
      padding: 1.5rem;
      color: #1a1a1a;
    }

    /* En-tête de page */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .page-header h1 {
      font-size: 1.1rem;
      font-weight: 500;
      color: #2d6a4f;
    }

    .page-header p {
      font-size: 0.8rem;
      color: #888;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-retour {
      font-size: 0.85rem;
      color: #2d6a4f;
      text-decoration: none;
      border: 1px solid #2d6a4f;
      padding: 6px 14px;
      border-radius: 8px;
    }

    /* Bouton rituels */
    .btn-rituels {
      font-size: 0.85rem;
      color: #6b4fa0;
      background: #f0ecf8;
      border: 1px solid #c4b0e0;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-rituels:hover {
      background: #e4d9f5;
    }

    /* Conteneur principal */
    .semaine-wrapper {
      background: white;
      border-radius: 12px;
      border: 1px solid #e5e5e0;
      overflow: hidden;
    }

    /* En-tête du tableau */
    .semaine-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #e5e5e0;
      background: #fafaf8;
    }

    .semaine-titre h2 {
      font-size: 0.95rem;
      font-weight: 500;
      color: #1a1a1a;
    }

    .semaine-titre p {
      font-size: 0.75rem;
      color: #888;
      margin-top: 2px;
    }

    /* Bascule matin / après-midi */
    .toggle-group {
      display: flex;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
    }

    .toggle-btn {
      padding: 6px 16px;
      font-size: 0.8rem;
      border: none;
      cursor: pointer;
      background: transparent;
      color: #888;
      transition: background 0.15s;
    }

    .toggle-btn.actif {
      background: #e8f4ee;
      color: #2d6a4f;
      font-weight: 500;
    }

    /* Grille principale */
    .grille {
      display: grid;
      grid-template-columns: 110px repeat(var(--nb-jours, 3), 1fr);
    }

    /* En-têtes colonnes */
    .col-header {
      padding: 8px 12px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #666;
      background: #f5f5f0;
      border-right: 1px solid #e5e5e0;
      border-bottom: 1px solid #ccc;
      text-align: center;
    }

    .col-header:last-child { border-right: none; }
    .col-header.col-horaire { text-align: left; }

    /* Colonne horaire + moment */
    .cellule-horaire {
      padding: 8px 10px;
      background: #f5f5f0;
      border-right: 1px solid #e5e5e0;
      border-bottom: 1px solid #e5e5e0;
    }

    .horaire-time {
      font-size: 0.68rem;
      color: #aaa;
      white-space: nowrap;
    }

    .horaire-moment {
      font-size: 0.7rem;
      font-weight: 500;
      color: #666;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      line-height: 1.3;
    }

    /* Cellule de contenu */
    .cellule {
      padding: 8px 10px;
      border-right: 1px solid #e5e5e0;
      border-bottom: 1px solid #e5e5e0;
      min-height: 64px;
      vertical-align: top;
    }

    .cellule:last-child { border-right: none; }

    /* Cellule pleine largeur */
    .cellule-pleine {
      grid-column: 2 / -1;
      background: #f9f9f7;
    }

    /* Fond ateliers */
    .cellule-ateliers { background: #f0f7eb; }

    /* Cellule vide (à remplir) */
    .cellule-vide {
      background: #fafaf8;
      border: 1px dashed #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ccc;
      font-size: 0.7rem;
      font-style: italic;
      min-height: 64px;
    }

    /* Groupe d'entrées dans une cellule */
    .groupe { display: flex; flex-direction: column; gap: 6px; }

    /* Séparateur PS / GS */
    .separateur {
      border: none;
      border-top: 1px dashed #ddd;
      margin: 2px 0;
    }

    /* Une entrée */
    .entree { display: flex; flex-direction: column; gap: 2px; }

    .entree-top {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    /* Badges */
    .badge {
      font-size: 0.65rem;
      font-weight: 500;
      padding: 1px 6px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .badge-ps   { background: #fff3cd; color: #856404; }
    .badge-gs   { background: #dbeafe; color: #1e40af; }
    .badge-psgs { background: #f0f0ee; color: #555; }

    .badge-role {
      background: #f0f0ee;
      color: #888;
      border: 1px solid #e0e0dc;
    }

    .badge-fixe {
      background: #eef2ff;
      color: #4338ca;
      font-size: 0.6rem;
    }

    /* Texte activité */
    .activite {
      font-size: 0.75rem;
      color: #1a1a1a;
      line-height: 1.3;
    }

    /* Lien programme */
    .programme {
      font-size: 0.65rem;
      color: #aaa;
      padding-left: 2px;
      line-height: 1.3;
    }

    /* État chargement / erreur */
    .etat {
      padding: 2rem;
      text-align: center;
      color: #888;
      font-size: 0.85rem;
    }

    .etat-erreur { color: #c0392b; }

    /* Vue après-midi cachée par défaut */
    .vue-matin { display: contents; }
    .vue-aprem { display: none; }

    /* =============================================
       TIROIR RITUELS
    ============================================= */

    /* Overlay sombre derrière le tiroir */
    .tiroir-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.25);
      z-index: 100;
    }

    .tiroir-overlay.actif { display: block; }

    /* Tiroir lui-même */
    .tiroir {
      position: fixed;
      top: 0;
      right: -480px;
      width: 480px;
      max-width: 95vw;
      height: 100vh;
      background: white;
      z-index: 101;
      display: flex;
      flex-direction: column;
      box-shadow: -4px 0 24px rgba(0,0,0,0.12);
      transition: right 0.25s ease;
    }

    .tiroir.actif { right: 0; }

    /* En-tête tiroir */
    .tiroir-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #e5e5e0;
      background: #f0ecf8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .tiroir-header h3 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #6b4fa0;
    }

    .tiroir-header p {
      font-size: 0.75rem;
      color: #9b7ec8;
      margin-top: 2px;
    }

    .btn-fermer {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: #9b7ec8;
      padding: 4px 8px;
      border-radius: 6px;
      line-height: 1;
    }

    .btn-fermer:hover { background: #e4d9f5; }

    /* Sélecteur de semaine */
    .tiroir-semaines {
      display: flex;
      gap: 6px;
      padding: 10px 1.25rem;
      border-bottom: 1px solid #e5e5e0;
      overflow-x: auto;
      flex-shrink: 0;
      background: #fafaf8;
    }

    .btn-semaine {
      padding: 5px 12px;
      font-size: 0.78rem;
      font-weight: 500;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: white;
      color: #666;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .btn-semaine.actif {
      background: #6b4fa0;
      color: white;
      border-color: #6b4fa0;
    }

    .btn-semaine:hover:not(.actif) { background: #f0ecf8; border-color: #c4b0e0; }

    /* Badge lecture seule */
    .badge-lecture {
      font-size: 0.65rem;
      background: #fff3cd;
      color: #856404;
      padding: 1px 6px;
      border-radius: 4px;
      margin-left: 6px;
    }

    /* Corps du tiroir — scrollable */
    .tiroir-corps {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.25rem;
    }

    /* Section J1 / J2 / J3 / J4 */
    .rituel-jour {
      margin-bottom: 1rem;
    }

    .rituel-jour-titre {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .rituel-jour-titre.j1 { color: #6b4fa0; }
    .rituel-jour-titre.j1::after {
      content: 'Lundi remplaçant';
      font-size: 0.62rem;
      font-weight: 400;
      background: #f0ecf8;
      color: #9b7ec8;
      padding: 1px 6px;
      border-radius: 4px;
      letter-spacing: 0;
      text-transform: none;
    }

    /* Carte rituel */
    .rituel-carte {
      background: #fafaf8;
      border: 1px solid #e5e5e0;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 6px;
    }

    .rituel-carte.j1 {
      border-color: #c4b0e0;
      background: #f9f6fd;
    }

    .rituel-carte-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }

    .rituel-carte-titre {
      font-size: 0.8rem;
      font-weight: 500;
      color: #1a1a1a;
      line-height: 1.3;
      flex: 1;
    }

    .rituel-carte-desc {
      font-size: 0.72rem;
      color: #666;
      line-height: 1.4;
      margin-top: 4px;
    }

    /* Badge introduction */
    .badge-intro {
      font-size: 0.62rem;
      font-weight: 700;
      background: #fff3cd;
      color: #856404;
      border: 1px solid #fcd34d;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Actions rituel (lecture seule masquées) */
    .rituel-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .btn-action {
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #ddd;
      background: white;
      cursor: pointer;
      color: #555;
      transition: all 0.15s;
    }

    .btn-action:hover { background: #f0f0ee; }

    .btn-action.ajouter {
      border-color: #2d6a4f;
      color: #2d6a4f;
    }

    .btn-action.ajouter:hover { background: #e8f4ee; }

    /* Message semaine non courante */
    .tiroir-lecture-seule {
      font-size: 0.75rem;
      color: #9b7ec8;
      background: #f0ecf8;
      border: 1px solid #c4b0e0;
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 12px;
      text-align: center;
    }

    /* État chargement tiroir */
    .tiroir-chargement {
      text-align: center;
      color: #aaa;
      font-size: 0.8rem;
      padding: 2rem;
    }

    /* Impression */
    @media print {
      body { background: white; padding: 0; }
      .btn-retour { display: none; }
      .btn-rituels { display: none; }
      .toggle-group { display: none; }
      .semaine-wrapper { border: none; border-radius: 0; }
      .tiroir { display: none; }
      .tiroir-overlay { display: none; }
    }
  </style>
</head>
<body>

<div class="page-header">
  <div>
    <h1>🍀 Cahier journal</h1>
    <p id="sous-titre">Chargement…</p>
  </div>
  <div class="header-actions">
    <button class="btn-rituels" onclick="ouvrirTiroir()">
      📋 Rituels de la semaine
    </button>
    <a href="index.html" class="btn-retour">← Retour</a>
  </div>
</div>

<div class="semaine-wrapper" id="semaine-wrapper">
  <div class="etat" id="etat-chargement">Chargement de la semaine…</div>
</div>

<!-- Overlay -->
<div class="tiroir-overlay" id="tiroir-overlay" onclick="fermerTiroir()"></div>

<!-- Tiroir rituels -->
<div class="tiroir" id="tiroir-rituels">
  <div class="tiroir-header">
    <div>
      <h3>📋 Rituels MHM — Période 1</h3>
      <p id="tiroir-sous-titre">Cliquer sur une semaine pour explorer</p>
    </div>
    <button class="btn-fermer" onclick="fermerTiroir()">✕</button>
  </div>

  <!-- Sélecteur semaines -->
  <div class="tiroir-semaines" id="tiroir-semaines">
    <!-- Généré dynamiquement -->
  </div>

  <!-- Corps -->
  <div class="tiroir-corps" id="tiroir-corps">
    <div class="tiroir-chargement">Sélectionnez une semaine ci-dessus</div>
  </div>
</div>

<script>
// =============================================
// Configuration
// =============================================
const SUPABASE_URL = 'https://wqsprjlocuhandhvpytx.supabase.co';

const JOURS_LABELS = {
  mardi:    'Mardi',
  jeudi:    'Jeudi',
  vendredi: 'Vendredi'
};

// Mapping semaine app -> semaine MHM (offset -1, S1 rentrée = S0 MHM)
const LABEL_SEMAINES = {
  1: 'S1 — Rentrée',
  2: 'S2 — MHM S1',
  3: 'S3 — MHM S2',
  4: 'S4 — MHM S3',
  5: 'S5 — MHM S4',
  6: 'S6 — MHM S5',
  7: 'S7 — Tampon'
};

// Moments du matin dans l'ordre
const ORDRE_MATIN = [
  'Accueil',
  'Rituels',
  'Rituels maths PS',
  'Ateliers rotation 1',
  'Rituels maths GS',
  'Ateliers rotation 2',
  'Motricité',
  'Récréation',
  'Motricité / Littérature'
];

// Moments de l'après-midi dans l'ordre
const ORDRE_APREM = [
  'Accueil',
  'Sieste PS',
  'Phonologie',
  'Maths',
  'Réveil PS',
  'Sciences / Découverte',
  'Récréation',
  'Anglais / Arts'
];

// =============================================
// État global
// =============================================
let etatApp = {
  semaineId: null,        // UUID de la semaine courante affichée
  numeroSemaine: null,    // numéro de la semaine courante (1-7)
  periodeId: null,        // UUID de la période
  semaineTiroir: null,    // numéro semaine sélectionnée dans le tiroir
  reglesCache: {}         // cache { numeroSemaine: [regles] }
};

// =============================================
// Chargement principal
// =============================================
async function chargerSemaine() {
  const params = new URLSearchParams(window.location.search);
  const semaineId = params.get('id');

  if (!semaineId) {
    afficherErreur('Aucune semaine sélectionnée. Ajoutez ?id=UUID à l\'URL.');
    return;
  }

  etatApp.semaineId = semaineId;

  try {
    const res = await fetch(`/api/semaine?id=${semaineId}`);

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error || `Erreur ${res.status}`);
    }

    const data = await res.json();
    etatApp.numeroSemaine = data.semaine.numero_semaine;
    etatApp.periodeId = data.semaine.periode_id;
    afficherSemaine(data.semaine, data.creneaux);
    initialiserTiroir(data.semaine);

  } catch (err) {
    afficherErreur(`Impossible de charger la semaine : ${err.message}`);
  }
}

// =============================================
// Affichage de la semaine
// =============================================
function afficherSemaine(semaine, creneaux) {
  const jours = [];
  if (semaine.a_mardi) jours.push('mardi');
  jours.push('jeudi');
  jours.push('vendredi');

  const dateLundi = new Date(semaine.date_lundi);

  document.getElementById('sous-titre').textContent =
    `Année 2026-2027 — Période ${semaine.periode?.numero || '?'} — Semaine ${semaine.numero_semaine}`;

  const labelJour = (jour) => {
    const offset = { mardi: 1, jeudi: 3, vendredi: 4 };
    const d = new Date(dateLundi);
    d.setDate(dateLundi.getDate() + offset[jour]);
    return `${JOURS_LABELS[jour]} ${d.getDate()}`;
  };

  const parPeriode = { matin: {}, aprem: {} };
  for (const c of creneaux) {
    const periode = c.periode || 'matin';
    const moment  = c.moment  || 'Divers';
    const cleJour = c.jour || '__plein__';
    if (!parPeriode[periode][moment]) parPeriode[periode][moment] = {};
    if (!parPeriode[periode][moment][cleJour]) parPeriode[periode][moment][cleJour] = [];
    parPeriode[periode][moment][cleJour].push(c);
  }

  const wrapper = document.getElementById('semaine-wrapper');
  wrapper.innerHTML = `
    <div class="semaine-header">
      <div class="semaine-titre">
        <h2>Semaine ${semaine.numero_semaine} — P${semaine.periode?.numero || '?'}</h2>
        <p>${jours.length} jours de classe · ${jours.map(j => JOURS_LABELS[j]).join(' / ')}</p>
      </div>
      <div class="toggle-group">
        <button class="toggle-btn actif" onclick="basculerVue('matin', this)">Matin</button>
        <button class="toggle-btn" onclick="basculerVue('aprem', this)">Après-midi</button>
      </div>
    </div>

    <div class="grille" id="grille" style="--nb-jours: ${jours.length}">
      <div class="col-header col-horaire"></div>
      ${jours.map(j => `<div class="col-header">${labelJour(j)}</div>`).join('')}

      <div class="vue-matin" id="vue-matin">
        ${construireVue(parPeriode.matin, ORDRE_MATIN, jours, creneaux, 'matin')}
      </div>

      <div class="vue-aprem" id="vue-aprem">
        ${construireVue(parPeriode.aprem, ORDRE_APREM, jours, creneaux, 'aprem')}
      </div>
    </div>
  `;
}

// =============================================
// Construction d'une vue (matin ou aprem)
// =============================================
function construireVue(momentMap, ordre, jours, tousCreneaux, periode) {
  const momentsPresents = new Set([...ordre, ...Object.keys(momentMap)]);
  const momentsAffiches = ordre.filter(m => momentsPresents.has(m));

  for (const m of Object.keys(momentMap)) {
    if (!momentsAffiches.includes(m)) momentsAffiches.push(m);
  }

  let html = '';

  for (const moment of momentsAffiches) {
    const creneauxDuMoment = momentMap[moment] || {};

    let heureDebut = '';
    let heureFin = '';
    const toutesLesCles = ['__plein__', ...jours];
    for (const cle of toutesLesCles) {
      const cs = creneauxDuMoment[cle];
      if (cs && cs.length > 0) {
        heureDebut = cs[0].heure_debut?.substring(0, 5) || '';
        heureFin   = cs[0].heure_fin?.substring(0, 5)   || '';
        break;
      }
    }

    if (!heureDebut) {
      const horairesDefaut = getHorairesDefaut(moment, periode);
      heureDebut = horairesDefaut.debut;
      heureFin = horairesDefaut.fin;
    }

    const estPlein = estMomentPlein(moment);

    html += `
      <div class="cellule-horaire">
        <div class="horaire-time">${heureDebut}${heureFin ? ' – ' + heureFin : ''}</div>
        <div class="horaire-moment">${moment}</div>
      </div>
    `;

    if (estPlein) {
      const cs = [];
      if (creneauxDuMoment['__plein__']) {
        cs.push(...creneauxDuMoment['__plein__']);
      } else {
        for (const jour of jours) {
          if (creneauxDuMoment[jour]) { cs.push(...creneauxDuMoment[jour]); break; }
        }
      }
      html += `<div class="cellule cellule-pleine">
        ${cs.length > 0 ? renderGroupe(cs) : '<span style="color:#ccc;font-size:0.7rem;font-style:italic">—</span>'}
      </div>`;
    } else {
      for (const jour of jours) {
        const cs = creneauxDuMoment[jour] || [];
        const estAtelier = moment.toLowerCase().includes('atelier');
        const classeExtra = estAtelier ? ' cellule-ateliers' : '';

        if (cs.length > 0) {
          html += `<div class="cellule${classeExtra}">${renderGroupe(cs)}</div>`;
        } else {
          html += `<div class="cellule${classeExtra} cellule-vide">À remplir</div>`;
        }
      }
    }
  }

  return html;
}

// =============================================
// Rendu d'un groupe de créneaux dans une cellule
// =============================================
function renderGroupe(creneaux) {
  let html = '<div class="groupe">';
  let precedentNiveau = null;

  for (const c of creneaux) {
    if (precedentNiveau && precedentNiveau !== c.niveau && c.niveau) {
      html += '<hr class="separateur">';
    }

    html += '<div class="entree"><div class="entree-top">';

    if (c.niveau === 'PS') {
      html += '<span class="badge badge-ps">PS</span>';
    } else if (c.niveau === 'GS') {
      html += '<span class="badge badge-gs">GS</span>';
    } else if (c.niveau === 'PS+GS') {
      html += '<span class="badge badge-ps">PS</span><span class="badge badge-gs">GS</span>';
    }

    if (c.type === 'fixe') {
      html += '<span class="badge badge-fixe">FIXE</span>';
    }

    if (c.role) {
      html += `<span class="badge badge-role">${c.role}</span>`;
    }

    const texte = c.activite || c.titre_fixe || (c.regle_id ? `[Règle : ${c.regle_id}]` : '—');
    html += `<span class="activite">${texte}</span>`;

    html += '</div>';

    if (c.lien_programme) {
      html += `<div class="programme">► ${c.lien_programme}</div>`;
    }

    if (c.notes) {
      html += `<div class="programme" style="color:#888">${c.notes}</div>`;
    }

    html += '</div>';
    precedentNiveau = c.niveau;
  }

  html += '</div>';
  return html;
}

// =============================================
// TIROIR RITUELS
// =============================================

function initialiserTiroir(semaine) {
  // Générer les boutons semaines S1 à S7
  const conteneur = document.getElementById('tiroir-semaines');
  let html = '';
  for (let s = 1; s <= 7; s++) {
    const label = s <= 6 ? `S${s}` : 'S7 Tampon';
    html += `<button class="btn-semaine${s === semaine.numero_semaine ? ' actif' : ''}"
      data-semaine="${s}"
      onclick="selectionnerSemaineTiroir(${s}, this)">${label}</button>`;
  }
  conteneur.innerHTML = html;

  // Charger d'emblée la semaine courante
  selectionnerSemaineTiroir(semaine.numero_semaine, conteneur.querySelector('.actif'));
}

function ouvrirTiroir() {
  document.getElementById('tiroir-overlay').classList.add('actif');
  document.getElementById('tiroir-rituels').classList.add('actif');
}

function fermerTiroir() {
  document.getElementById('tiroir-overlay').classList.remove('actif');
  document.getElementById('tiroir-rituels').classList.remove('actif');
}

async function selectionnerSemaineTiroir(numeroSemaine, btnEl) {
  // Mettre à jour le bouton actif
  document.querySelectorAll('.btn-semaine').forEach(b => b.classList.remove('actif'));
  if (btnEl) btnEl.classList.add('actif');

  etatApp.semaineTiroir = numeroSemaine;
  const estCourante = (numeroSemaine === etatApp.numeroSemaine);

  // Mettre à jour le sous-titre
  document.getElementById('tiroir-sous-titre').textContent =
    LABEL_SEMAINES[numeroSemaine] || `Semaine ${numeroSemaine}`;

  // Afficher chargement
  const corps = document.getElementById('tiroir-corps');
  corps.innerHTML = '<div class="tiroir-chargement">Chargement des rituels…</div>';

  try {
    const regles = await chargerReglesTiroir(numeroSemaine);
    afficherReglesTiroir(regles, numeroSemaine, estCourante);
  } catch (err) {
    corps.innerHTML = `<div class="tiroir-chargement" style="color:#c0392b">Erreur : ${err.message}</div>`;
  }
}

async function chargerReglesTiroir(numeroSemaine) {
  // Vérifier le cache
  if (etatApp.reglesCache[numeroSemaine]) {
    return etatApp.reglesCache[numeroSemaine];
  }

  // S7 tampon — pas de règles MHM
  if (numeroSemaine === 7) {
    etatApp.reglesCache[7] = [];
    return [];
  }

  // Appel à l'endpoint proxy Vercel
  const res = await fetch('/api/rituels?periode=1');

  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.error || `Erreur ${res.status}`);
  }

  const data = await res.json();

  // Mettre en cache pour toutes les semaines (les règles sont les mêmes,
  // c'est l'affichage qui varie selon la semaine sélectionnée)
  for (let s = 1; s <= 6; s++) {
    etatApp.reglesCache[s] = data.regles;
  }

  return data.regles;
}


function afficherReglesTiroir(regles, numeroSemaine, estCourante) {
  const corps = document.getElementById('tiroir-corps');
  let html = '';

  // Bandeau lecture seule si semaine non courante
  if (!estCourante) {
    html += `<div class="tiroir-lecture-seule">
      👁 Consultation uniquement — les modifications ne sont disponibles que sur la semaine en cours
    </div>`;
  }

  // Séparer quotidiens et par jour
  const quotidiens = regles.filter(r => r.frequence_type === 'quotidien');
  const parJour = { 1: [], 2: [], 3: [], 4: [] };
  for (const r of regles) {
    if (r.jour_mhm !== null && r.jour_mhm !== undefined) {
      if (parJour[r.jour_mhm]) parJour[r.jour_mhm].push(r);
    }
  }

  // Rituels quotidiens (tous les jours)
  if (quotidiens.length > 0) {
    html += `<div class="rituel-jour">
      <div class="rituel-jour-titre">Chaque jour</div>`;
    for (const r of quotidiens) {
      html += renderCarteTiroir(r, false, estCourante);
    }
    html += `</div>`;
  }

  // Rituels J1 (lundi — remplaçant)
  if (parJour[1].length > 0) {
    html += `<div class="rituel-jour">
      <div class="rituel-jour-titre j1">Jour 1 — Lundi</div>`;
    for (const r of parJour[1]) {
      html += renderCarteTiroir(r, true, estCourante);
    }
    html += `</div>`;
  }

  // Rituels J2 (mardi)
  if (parJour[2].length > 0) {
    html += `<div class="rituel-jour">
      <div class="rituel-jour-titre">Jour 2 — Mardi</div>`;
    for (const r of parJour[2]) {
      html += renderCarteTiroir(r, false, estCourante);
    }
    html += `</div>`;
  }

  // Rituels J3 (jeudi)
  if (parJour[3].length > 0) {
    html += `<div class="rituel-jour">
      <div class="rituel-jour-titre">Jour 3 — Jeudi</div>`;
    for (const r of parJour[3]) {
      html += renderCarteTiroir(r, false, estCourante);
    }
    html += `</div>`;
  }

  // Rituels J4 (vendredi)
  if (parJour[4].length > 0) {
    html += `<div class="rituel-jour">
      <div class="rituel-jour-titre">Jour 4 — Vendredi</div>`;
    for (const r of parJour[4]) {
      html += renderCarteTiroir(r, false, estCourante);
    }
    html += `</div>`;
  }

  if (html === '' || (html.indexOf('rituel-carte') === -1)) {
    html += `<div class="tiroir-chargement">Aucun rituel MHM pour cette semaine.</div>`;
  }

  corps.innerHTML = html;
}

function renderCarteTiroir(regle, estJ1, estCourante) {
  // Extraire un titre court depuis la description (avant le premier ":")
  const titreMatch = regle.description.match(/^([^:]+)/);
  const titre = titreMatch ? titreMatch[1].trim() : regle.id;
  const desc = regle.description;

  // Badge niveau
  let badgeNiveau = '';
  if (regle.niveau === 'PS') {
    badgeNiveau = '<span class="badge badge-ps">PS</span>';
  } else if (regle.niveau === 'GS') {
    badgeNiveau = '<span class="badge badge-gs">GS</span>';
  } else if (regle.niveau === 'PS+GS') {
    badgeNiveau = '<span class="badge badge-ps">PS</span><span class="badge badge-gs">GS</span>';
  }

  // Badge introduction
  const badgeIntro = regle.est_introduction
    ? '<span class="badge-intro">⚠ Introduction</span>'
    : '';

  // Actions — uniquement si semaine courante
  let actions = '';
  if (estCourante) {
    const idSafe = regle.id.replace(/'/g, '');
    actions = `<div class="rituel-actions">
      <button class="btn-action ajouter" data-regle-id="${idSafe}" onclick="ajouterRituel('${idSafe}')">+ Ajouter à un jour</button>
    </div>`;
  }

  return `<div class="rituel-carte${estJ1 ? ' j1' : ''}">
    <div class="rituel-carte-top">
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        ${badgeNiveau}
        <span class="rituel-carte-titre">${titre}</span>
      </div>
      ${badgeIntro}
    </div>
    <div class="rituel-carte-desc">${desc}</div>
    ${actions}
  </div>`;
}
